<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trung Tâm Bản Tin Di Sản 3D</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #e5e7eb; 
            color: #1f2937;
            overflow-x: hidden;
            margin: 0;
        }

        /* --- NỀN HẠT 3D TƯƠNG TÁC --- */
        #particles-js {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 1; 
            background-color: #e5e7eb;
        }

        main {
            position: relative;
            z-index: 10; 
        }

        /* --- HIỆU ỨNG KHÔNG GIAN LẬT THẺ 3D NÂNG CẤP --- */
        .perspective-1500 { perspective: 1500px; }
        .preserve-3d { transform-style: preserve-3d; }
        .backface-hidden { -webkit-backface-visibility: hidden; backface-visibility: hidden; }
        .rotate-y-180 { transform: rotateY(180deg); }
        
        /* Hiệu ứng xoay kết hợp hiệu ứng nhấc bổng khối (TranslateZ) */
        .card-3d {
            transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .card-3d:hover .card-inner { 
            transform: rotateY(180deg);
        }

        /* Đổ bóng tầng sâu kết hợp vầng sáng hào quang mềm mại */
        .shadow-3d-glow {
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.06), 0 1px 3px rgba(0, 0, 0, 0.02);
            transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
        }
        .card-3d:hover .shadow-3d-glow {
            box-shadow: 0 30px 60px rgba(128, 29, 29, 0.2), 0 0 30px rgba(128, 29, 29, 0.1);
        }

        /* Tùy biến thanh cuộn mô tả mặt sau siêu mảnh */
        .custom-scrollbar::-webkit-scrollbar {
            width: 3px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.03);
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.25);
            border-radius: 10px;
        }

        /* Nút quay lại lơ lửng góc trang */
        .floating-back-btn {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0,0,0,0.08);
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .floating-back-btn:hover {
            background: #1c1917;
            color: #ffffff;
            transform: scale(1.05);
        }
    </style>
</head>
<body class="antialiased">

    <div id="particles-js"></div>

    <a href="index.html" class="floating-back-btn fixed top-6 left-6 z-50 text-stone-700 px-5 py-2.5 rounded-full font-bold text-xs uppercase tracking-wider transition-all duration-300 flex items-center gap-2">
        <i class="fa-solid fa-arrow-left text-xs" style="color: #801d1d;" id="back-icon"></i> Trang Chủ
    </a>

    <main class="max-w-7xl mx-auto px-4 md:px-8 pt-24 pb-24">
        
        <div class="mb-14 flex flex-col md:flex-row md:items-center justify-between gap-6 border-b border-stone-300/60 pb-8">
            <div>
                <h1 class="text-3xl md:text-4xl font-extrabold text-stone-900 tracking-tight flex items-center gap-3">
                    <span class="w-2 h-8 rounded-full inline-block" style="background-color: #801d1d;"></span>
                    Giới thiệu di sản văn hóa phi vật thể
                </h1>
                <p class="text-xs text-stone-500 mt-1.5 uppercase tracking-widest font-semibold">Tìm hiểu thông tin chi tiết về di sản văn hóa phi vật thể tại Tây Ninh</p>
            </div>
            
            <div class="relative w-full md:w-80">
                <input type="text" id="search-input" placeholder="Gõ tìm tên di sản, từ khóa..." class="w-full bg-white border border-stone-300/80 rounded-full pl-5 pr-12 py-3 text-xs font-semibold focus:outline-none focus:ring-2 focus:ring-stone-400 shadow-sm transition-all">
                <i class="fa-solid fa-magnifying-glass absolute right-4 top-3.5 text-stone-400 text-sm"></i>
            </div>
        </div>

        <div class="flex flex-wrap gap-2.5 text-xs mb-10" id="category-filters">
            </div>

        <section class="relative">
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6" id="news-grid">
                </div>
            
            <div id="empty-state" class="hidden text-center py-24 bg-white/40 border border-stone-300/40 rounded-2xl backdrop-blur-sm">
                <div class="w-16 h-16 mx-auto bg-stone-200 text-stone-400 rounded-full flex items-center justify-center text-xl mb-3 shadow-inner">
                    <i class="fa-solid fa-ban"></i>
                </div>
                <p class="text-sm font-bold text-stone-700">Không tìm thấy tư liệu trùng khớp!</p>
                <p class="text-xs text-stone-400 mt-1">Hãy thử xóa từ khóa hoặc chọn một danh mục di sản khác.</p>
            </div>
        </section>

    </main>

    <footer class="py-12 border-t border-stone-300 px-4 md:px-6 bg-stone-300/40 text-center text-stone-400 text-xs tracking-wider relative z-20">
        © 2026 DI SẢN VĂN HÓA PHI VẬT THỂ 3D EXPERIENCE. ALL RIGHTS RESERVED.
    </footer>

    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script>
        particlesJS("particles-js", {
            "particles": {
                "number": { "value": 60, "density": { "enable": true, "value_area": 900 } },
                "color": { "value": "#801d1d" }, 
                "shape": { "type": "circle" },
                "opacity": { "value": 0.3, "random": false },
                "size": { "value": 3.5, "random": true },
                "line_linked": { "enable": true, "distance": 150, "color": "#4b5563", "opacity": 0.13, "width": 1 },
                "move": { "enable": true, "speed": 1.0, "direction": "none", "out_mode": "out" }
            },
            "interactivity": {
                "detect_on": "canvas",
                "events": { "onhover": { "enable": true, "mode": "grab" }, "onclick": { "enable": true, "mode": "push" } },
                "modes": { "grab": { "distance": 150, "line_linked": { "opacity": 0.35 } } }
            },
            "retina_detect": true
        });
    </script>

    <script>
        let allHeritages = [];
        let currentFilter = 'all';
        let searchQuery = '';

        async function initNewsPage() {
            try {
                const response = await fetch('data/heritages.json');
                allHeritages = await response.json();
                
                renderDynamicFilters();
                render3DNewsGrid();
                
            } catch (error) {
                console.error("Lỗi liên kết dữ liệu heritages.json:", error);
            }
        }

        // Tạo các tab bộ lọc bo góc tròn mịn màng 
        function renderDynamicFilters() {
            const container = document.getElementById('category-filters');
            const categories = ['all', ...new Set(allHeritages.map(item => item.cat))];
            
            container.innerHTML = '';
            categories.forEach(cat => {
                const isAll = cat === 'all';
                const label = isAll ? 'Tất cả' : cat;
                
                const btn = document.createElement('button');
                btn.id = `filter-${cat}`;
                btn.innerText = label;
                btn.onclick = () => switchCategory(cat);
                
                if (isAll) {
                    btn.className = "filter-btn px-4 py-2.5 rounded-full font-bold shadow-md text-white transition-all transform active:scale-95";
                    btn.style.backgroundColor = "#801d1d";
                } else {
                    btn.className = "filter-btn px-4 py-2.5 rounded-full font-semibold shadow-sm text-stone-600 border border-stone-300 bg-white/80 backdrop-blur-sm hover:bg-stone-50 transition-all transform active:scale-95";
                }
                
                container.appendChild(btn);
            });
        }

        function switchCategory(category) {
            currentFilter = category;
            
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.className = "filter-btn px-4 py-2.5 rounded-full font-semibold shadow-sm text-stone-600 border border-stone-300 bg-white/80 backdrop-blur-sm hover:bg-stone-50 transition-all transform active:scale-95";
                btn.style.backgroundColor = "";
            });
            
            const activeBtn = document.getElementById(`filter-${category}`);
            activeBtn.className = "filter-btn px-4 py-2.5 rounded-full font-bold shadow-md text-white transition-all transform active:scale-95";
            activeBtn.style.backgroundColor = "#801d1d";
            
            render3DNewsGrid();
        }

        // Đổ dữ liệu vào lưới thẻ lật đồng cấp 3D 
        function render3DNewsGrid() {
            const grid = document.getElementById('news-grid');
            const emptyState = document.getElementById('empty-state');

            let filtered = allHeritages.filter(item => {
                const matchesCat = currentFilter === 'all' || item.cat === currentFilter;
                const matchesSearch = item.name.toLowerCase().includes(searchQuery.toLowerCase()) || 
                                      item.desc.toLowerCase().includes(searchQuery.toLowerCase());
                return matchesCat && matchesSearch;
            });

            if (filtered.length === 0) {
                grid.classList.add('hidden');
                emptyState.classList.remove('hidden');
                return;
            } else {
                emptyState.classList.add('hidden');
                grid.classList.remove('hidden');
            }

            grid.innerHTML = '';
            
            filtered.forEach(item => {
                let currentImg = item.img || (item.images && item.images.length > 0 ? item.images[0] : 'https://images.unsplash.com/photo-1599707367072-cd6ada2bc375?q=80&w=600');

                const cardBox = document.createElement('div');
                cardBox.className = "card-3d h-[410px] perspective-1500 cursor-pointer group";
                
                cardBox.innerHTML = `
                    <div class="card-inner relative w-full h-full preserve-3d transition-transform duration-700 rounded-2xl shadow-3d-glow bg-white">
                        
                        <div class="card-front absolute inset-0 w-full h-full backface-hidden rounded-2xl border border-stone-200/80 flex flex-col justify-between overflow-hidden bg-white">
                            <div class="relative h-[64%] w-full overflow-hidden bg-stone-50">
                                <img src="${currentImg}" class="w-full h-full object-cover transition duration-700 group-hover:scale-105" onerror="this.src='https://images.unsplash.com/photo-1598977123418-45f04b016823?q=80&w=600'"/>
                                <div class="absolute inset-0 bg-gradient-to-t from-black/25 via-transparent to-transparent"></div>
                                <span class="absolute top-3.5 left-3.5 bg-stone-900/90 text-white font-sans text-[9px] font-bold uppercase tracking-widest px-2.5 py-1 rounded-md shadow-sm">${item.cat}</span>
                            </div>
                            <div class="p-4 h-[36%] flex flex-col justify-center items-center text-center bg-white">
                                <h3 class="text-sm font-extrabold text-stone-900 line-clamp-2 px-1.5 leading-snug tracking-tight mb-2 group-hover:text-amber-900 transition-colors">${item.name}</h3>
                                <div class="text-[9px] text-stone-400 font-bold uppercase tracking-wider flex items-center gap-1.5 bg-stone-100 px-3 py-1 rounded-full">
                                    <i class="fa-solid fa-rotate animate-spin" style="animation-duration: 4s; color: #801d1d;"></i> Rà chuột để lật
                                </div>
                            </div>
                        </div>
                        
                        <div class="card-back absolute inset-0 w-full h-full backface-hidden rounded-2xl rotate-y-180 p-6 flex flex-col justify-between items-center border border-white/10" style="background-color: #1a1816;">
                            <div class="w-full border-b border-white/10 pb-2.5 text-center">
                                <span class="text-[9px] font-extrabold tracking-widest text-amber-400 uppercase">${item.cat}</span>
                                <h4 class="text-xs font-bold text-stone-100 mt-1 line-clamp-1">${item.name}</h4>
                            </div>
                            
                            <p class="text-[11px] text-stone-300 leading-relaxed text-justify overflow-y-auto flex-grow my-3 pr-1.5 custom-scrollbar font-light">${item.desc}</p>
                            
                            <div class="w-full pt-3.5 border-t border-white/5 flex items-center justify-between text-[10px]">
                                <span class="text-stone-400 font-medium"><i class="fa-solid fa-location-dot" style="color: #c5a059;"></i> Tây Ninh</span>
                                <a href="details.html?alias=${item.alias}" class="text-white text-[10px] font-bold tracking-widest py-2 px-5 rounded-full transition-all duration-300 hover:bg-white hover:text-black shadow-md uppercase" style="background-color: #801d1d;">
                                    Khám phá <i class="fa-solid fa-chevron-right text-[8px] ml-0.5"></i>
                                </a>
                            </div>
                        </div>

                    </div>
                `;
                grid.appendChild(cardBox);
            });
        }

        // Tìm kiếm tức thời thời gian thực
        document.getElementById('search-input').addEventListener('input', function(e) {
            searchQuery = e.target.value;
            render3DNewsGrid();
        });

        document.addEventListener('DOMContentLoaded', initNewsPage);
    </script>
</body>
</html>
